# sensorfw on the Mecha Comet (i.MX8M Plus).
#
# Three iio devices, all on I2C and all with in-tree drivers, so this is the
# plain iio path and not a hybris one:
#
#   invensense,icm42605  6-axis IMU, accelerometer + gyroscope (inv-icm42600)
#   st,lis2mdl           3-axis magnetometer
#   ti,opt3001           ambient light
#
# input_match is the iio device name, which for these drivers is the part name.

# Force-enable the plugins regardless of the hw-features that
# 20-sensors-default.conf would otherwise gate them on, and preload them at
# sensorfwd startup.
#
# Without the preload, the libqtsensors_sensorfw.so backend that the shell's
# OrientationSensor goes through calls requestSensor() before anything has
# called loadPlugin(), and sensorfwd answers "requested sensor id ... not
# registered": the screen does not rotate after boot, but starts rotating the
# moment any sensor app is opened, because that app loads the plugin the
# compositor needed. See the 0002-sensorfwd-Preload-sensors-listed-in-
# preload_sensors- patch in the sensorfw recipe, and the same block in
# sensord-pinetab2.conf where this was diagnosed.
#
# The quotes matter. sensorfw parses this with QSettings/IniFormat, which turns
# an unquoted comma-separated value into a QStringList - and the preload code
# reads it with value<QString>(), where a multi-element list stringifies to "".
# An unquoted list is silently read as empty and nothing is preloaded.
accelerometersensor=True
orientationsensor=True
preload_sensors="accelerometersensor,orientationsensor"

[plugins]
accelerometeradaptor = iiosensorsadaptor
orientationadaptor = iiosensorsadaptor
gyroscopeadaptor = iiosensorsadaptor
magnetometeradaptor = iiosensorsadaptor
alsadaptor = iiosensorsadaptor

# No transformation_matrix on any of these.
#
# The PinePhone Pro and PineTab2 both set one, but theirs were measured on the
# hardware - the matrix describes how the part is physically rotated relative to
# the panel, and imx8mp-mecha-comet.dts declares no mount-matrix to derive it
# from. An identity matrix that turns out to be wrong shows up immediately as
# rotation going the wrong way, which is easy to see and easy to correct; a
# matrix guessed here would be just as wrong and much harder to spot as the
# cause. Measure it on a Comet and add it in this file.

[accelerometer]
input_match=icm42605
intervals = "200=>2000"
default_interval=500

[gyroscope]
input_match=icm42605
intervals = "200=>2000"
default_interval=500

[magnetometer]
input_match=lis2mdl
intervals = "200=>2000"
default_interval=500

[als]
input_match=opt3001
intervals = "200=>2000"
default_interval=500
