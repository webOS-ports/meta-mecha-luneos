#@TYPE: Machine
#@NAME: Mecha Comet (i.MX8M Plus)
#@DESCRIPTION: Mecha Comet modular Linux handheld, NXP i.MX8M Plus variant.

# Silicon first, device second: mecha-comet.inc overrides DEFAULTTUNE to plain
# aarch64 and that has to land after the tune file sets it. Same ordering as
# pinetab2.conf's "require rk3566.inc" followed by DEFAULTTUNE = "aarch64".
require conf/machine/include/imx8mp.inc
require conf/machine/include/mecha-comet.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-comet"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-mecha"
PREFERRED_PROVIDER_u-boot = "u-boot-mecha"

KERNEL_DEVICETREE = "freescale/imx8mp-mecha-comet.dtb"

# u-boot is built once per DDR size, not once per board.
#
# The three configs differ only in their LPDDR4 timing table (board/mecha/comet/
# lpddr4_timing_{2,4,8}gb.c) and in the memory node of the SPL device tree, and
# the training tables are not interchangeable: the wrong one either fails
# training outright or brings the controller up at timings the parts do not
# meet. There is no run-time detection in Mecha's SPL to fall back on, so all
# three are built and deployed and the image carries one of them.
#
# Which one the .wic gets is COMET_DDR_VARIANT. Anyone with a different Comet
# flashes the matching flash.bin-<variant> from DEPLOY_DIR_IMAGE over the first
# partition gap; nothing else in the image is DDR-specific.
COMET_DDR_VARIANT ?= "8gb"

# wic runs out-of-process against an environment file built from WICVARS, not
# against the full datastore, so a variable that is not listed there expands to
# nothing inside a .wks. Without this the rawcopy line in
# comet-imx8mp-luneos-bsp-image.wks asks for "flash.bin-" and wic fails on a
# missing file that does not obviously correspond to anything.
#
# :append, not +=. image_types_wic.bbclass defines the default WICVARS list with
# "?=", and a machine conf is parsed before the class. "+=" therefore sets
# WICVARS while it is still empty, the class's "?=" then declines to overwrite
# it, and the whole default list - RECIPE_SYSROOT_NATIVE, IMAGE_ROOTFS,
# DEPLOY_DIR_IMAGE and the rest - is silently lost. The .env handed to wic ends
# up one line long and wic dies with "Unable to find the location of the native
# tools sysroot", which says nothing about the real cause.
WICVARS:append = " COMET_DDR_VARIANT"

# The device tree is named with its vendor directory in KERNEL_DEVICETREE,
# because that is where it lives in the kernel tree - but kernel-devicetree.bbclass
# flattens the vendor directory on deploy unless KERNEL_DTBVENDORED is set, so
# DEPLOY_DIR_IMAGE holds a bare imx8mp-mecha-comet.dtb and there is no
# freescale/ in it. IMAGE_BOOT_FILES names deployed files, not kernel-tree
# paths. meta-pine64-luneos's pinephone.conf is flat here for the same reason.
IMAGE_BOOT_FILES ?= " \
    Image-initramfs-${MACHINE}.bin;Image \
    imx8mp-mecha-comet.dtb \
"

WKS_FILE = "comet-imx8mp-luneos-bsp-image.wks"

WKS_FILE_DEPENDS ?= " \
    e2fsprogs-native \
    mtools-native \
    dosfstools-native \
    virtual/bootloader \
    virtual/kernel \
    initramfs-simple-image \
"

# INITRAMFS_IMAGE_BUNDLE rebuilds the kernel with the initramfs inside it, and
# that second kernel is what IMAGE_BOOT_FILES above copies. Without this the
# wic run can start before the bundled image exists.
do_image_wic[depends] += "initramfs-simple-image:do_image_complete"
