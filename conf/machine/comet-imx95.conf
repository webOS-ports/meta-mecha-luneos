#@TYPE: Machine
#@NAME: Mecha Comet (i.MX95)
#@DESCRIPTION: Mecha Comet modular Linux handheld, NXP i.MX95 variant.

# READ THIS BEFORE BUILDING
# =========================
# This machine is complete on the LuneOS side and cannot boot yet, for one
# reason that is entirely outside this layer: Mecha has not published board
# support for the i.MX95 Comet.
#
# Checked on 2026-09-17 across every branch of both repositories:
#
#   mecha-org/linux   fedora-mecha-7.1, fedora-mecha-7.2, mecha-v7.0-wip,
#                     mecha-v7.1-wip, imx/lf-6.12.20, imx-6.12.20-rev6
#     -> arch/arm64/boot/dts/freescale/imx8mp-mecha-comet.dts on all of them,
#        plus imx8mp-mecha-comet-m-gen6.dts (a board revision) on rev6.
#        No imx95-mecha-comet.dts anywhere. The only imx95 device trees in the
#        tree are NXP's own EVK/FRDM boards and third-party SoMs.
#
#   mecha-org/u-boot  v2026.07-mecha, v2026.04-mecha, imx/lf_v2025.04
#     -> board/mecha/comet is i.MX8M Plus only: imximage-8mp-lpddr4.cfg, three
#        LPDDR4 timing tables, and configs/mecha-comet-imx8mp-{2,4,8}gb_defconfig.
#        No i.MX95 defconfig and no i.MX95 board directory.
#
#   mecha-org/mecha-make  Devicetrees=freescale/imx8mp-mecha-comet.dtb, and the
#        only hardware profile is "comet" (i.MX8M Plus).
#
# So there is no device tree to name in KERNEL_DEVICETREE and no defconfig to
# name in UBOOT_MACHINE. Everything else - the panel, touch controller, radio,
# codec, sensors, the whole LuneOS side - is shared with the 8M Plus and is
# already wired up in mecha-comet.inc.
#
# TO FINISH THIS once Mecha publishes the board:
#   1. Set COMET_IMX95_DTB and COMET_IMX95_UBOOT_CONFIG below.
#   2. Drop the sanity check at the bottom of this file.
#   3. Confirm the boot container: the i.MX95 has no SPL doing DDR training
#      from PHY blobs the way the 8M Plus does. Its container is built from
#      ELE firmware + the M33 System Manager + OEI/DDR images + TF-A, so
#      firmware-imx-ddr is NOT what this machine needs - see imx95.inc and the
#      note in recipes-bsp/firmware-imx/firmware-imx-ddr_8.32.bb.
#   4. Mali-G310 is Valhall and panfrost drives it; mesa.bbappend already
#      enables that gallium driver for both machines.

require conf/machine/include/imx95.inc
require conf/machine/include/mecha-comet.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-comet"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-mecha"
PREFERRED_PROVIDER_u-boot = "u-boot-mecha"

# Fill these two in, and this machine builds.
COMET_IMX95_DTB ?= ""
COMET_IMX95_UBOOT_CONFIG ?= ""

KERNEL_DEVICETREE = "${COMET_IMX95_DTB}"

# Deployed name, not the kernel-tree path - see the note in comet-imx8mp.conf.
IMAGE_BOOT_FILES ?= " \
    Image-initramfs-${MACHINE}.bin;Image \
    ${@os.path.basename(d.getVar('COMET_IMX95_DTB') or '')} \
"

WKS_FILE = "comet-imx95-luneos-bsp-image.wks"

WKS_FILE_DEPENDS ?= " \
    e2fsprogs-native \
    mtools-native \
    dosfstools-native \
    virtual/bootloader \
    virtual/kernel \
    initramfs-simple-image \
"

do_image_wic[depends] += "initramfs-simple-image:do_image_complete"

# Fail at parse time with the reason, rather than 40 minutes later with a
# missing-device-tree error that says nothing about why it is missing.
#
# := so the expression is evaluated while this file is being parsed. An
# anonymous python block would be wrong here: a conf file's anonymous function
# is attached to the datastore and re-run for every recipe in the build, so the
# message would repeat thousands of times instead of stopping the parse once.
COMET_IMX95_SANITY := "${@bb.fatal('MACHINE=comet-imx95 has no board support to build against: Mecha has not published an i.MX95 Comet device tree or u-boot defconfig. Set COMET_IMX95_DTB and COMET_IMX95_UBOOT_CONFIG once they exist - see the header of conf/machine/comet-imx95.conf.') if not d.getVar('COMET_IMX95_DTB') or not d.getVar('COMET_IMX95_UBOOT_CONFIG') else ''}"
