# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mecha-luneos-layer"
BBFILE_PATTERN_mecha-luneos-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_mecha-luneos-layer = "7"

LAYERSERIES_COMPAT_mecha-luneos-layer = "wrynose"

# meta-arm supplies trusted-firmware-a (bl31) and, if it is ever switched on,
# optee-os. Nothing else here is layer-specific, so no other dependency.
LAYERDEPENDS_mecha-luneos-layer = "core meta-arm"
