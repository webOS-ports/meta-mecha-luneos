# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mecha-luneos-layer"
BBFILE_PATTERN_mecha-luneos-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_mecha-luneos-layer = "7"

LAYERSERIES_COMPAT_mecha-luneos-layer = "wrynose"

# Every layer this one actually needs, which is not the same as the layers it
# happens to sit beside.
#
#   core            mesa.bbappend
#   meta-arm        trusted-firmware-a (bl31), and optee-os if it is ever
#                   switched on
#   meta-luneos     sensorfw.bbappend
#   mainline-layer  initramfs-simple-image.bbappend (meta-smartphone/meta-mainline)
#
# This was "core meta-arm" and that was wrong: a .bbappend whose recipe is in an
# undeclared layer is a fatal parse error wherever that layer is absent, and the
# message names only the append - "No recipes available for
# .../luneos-diag_1.0.bbappend" - which reads like the recipe was deleted rather
# than like a missing dependency. That is exactly how it was found.
#
# meta-pine64-luneos is deliberately NOT here. It was an undeclared dependency
# too, for the luneos-diag bbappend, but the fix there was to move the recipe to
# meta-luneos and drop the append: a Mecha layer should not need the Pine layer.
LAYERDEPENDS_mecha-luneos-layer = "core meta-arm meta-luneos mainline-layer"
