# No OP-TEE in the boot chain, for now.
#
# Mecha's defconfigs set CONFIG_OPTEE=y, and arch/arm/dts/imx8mp-u-boot.dtsi
# wraps a "tee.bin" blob-ext in #ifdef CONFIG_OPTEE. With it on, binman refuses
# to build flash.bin unless a tee.bin is sitting in the build directory, so
# enabling it means also building optee-os for this board and getting its
# TZDRAM carve-out to agree with what TF-A was built for. That is a second
# bring-up problem stacked on top of the first one, and nothing LuneOS needs at
# boot goes through the secure world: the rootfs is not on RPMB, there is no
# verified boot here yet, and CONFIG_CMD_OPTEE_RPMB is a debugging convenience.
#
# TO TURN IT BACK ON: drop this fragment, add optee-os to the DEPENDS in
# u-boot-mecha_git.bb, copy its tee.bin next to bl31.bin in do_compile:prepend,
# and set TFA_SPD = "opteed" in the trusted-firmware-a bbappend. Do that on its
# own, not in the same change as a kernel or u-boot bump.
# CONFIG_OPTEE is not set
# CONFIG_CMD_OPTEE_RPMB is not set
