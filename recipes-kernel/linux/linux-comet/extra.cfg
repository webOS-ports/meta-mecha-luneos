# LuneOS additions on top of mecha_v8_defconfig.
#
# Only symbols that actually change something relative to that defconfig once
# KCONFIG_MODE = "--alldefconfig" is in effect. Everything the board itself
# needs - the CH13726A panel, etnaviv, nxpwifi, max98090, the ICM42605 IMU -
# is already in Mecha's config and is deliberately not repeated here, so a
# change they make is not shadowed by a stale copy in this layer.

# The initramfs is bundled into the kernel image (INITRAMFS_IMAGE_BUNDLE), so
# the kernel has to be able to unpack a gzip cpio with no module loaded yet.
CONFIG_BLK_DEV_INITRD=y
CONFIG_RD_GZIP=y

# Built-in, not the defconfig's =m.
#
# init.sh in the initramfs calls setup_usb_network 172.16.42.2/16, which builds
# a gadget through configfs. That runs before any rootfs is mounted, so there is
# nowhere to modprobe usb_f_* from - the whole gadget stack has to already be in
# the kernel. This is the one place where "=y where Mecha has =m" is deliberate
# rather than incidental.
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_F_FS=y

# Masquerading for Waydroid's network.
#
# mecha_v8_defconfig asks for CONFIG_IP_NF_NAT=m and CONFIG_NETFILTER_XT_NAT=m,
# but both are dropped during the merge because nothing left enabled after
# luneos-waydroid-anbox.cfg selects NF_NAT, and a tristate that nothing selects
# and that is not named explicitly ends up unset. The PineTab2 gets NF_NAT=y and
# NETFILTER_XT_NAT=y out of meta-pine64-luneos's fully expanded defconfig, which
# names them; a minimal defconfig does not, so name them here.
#
# Note luneos-waydroid-anbox.cfg sets CONFIG_NF_TABLES=n on purpose - LuneOS is
# on iptables, not nftables - so the nft* symbols in Mecha's defconfig are meant
# to disappear and are not restored here.
CONFIG_NF_NAT=y
CONFIG_NETFILTER_XT_NAT=y

# Do not build the display path in. It was tried on 2026-10-13 and measured at
# +925,696 bytes on Image (still 1.52 MiB inside the 0x40400000..0x43000000
# budget), and there are two good arguments for it:
#
# 1. luneos-recovery-ui draws on /dev/fb0 (lvgl is built with PACKAGECONFIG
#    "fbdev") and runs out of the bundled initramfs with no rootfs mounted, so
#    there is nowhere to modprobe drm.ko or imx-lcdif.ko from. Recovery
#    therefore has no screen at all while these are modules.
# 2. A board that has run Mecha's own OS inherits module_blacklist=imx_lcdif
#    from its saved u-boot environment (see README.md), and module_blacklist
#    does not apply to built-in code.
#
# Both are outweighed by this: powering up the display block raises an
# asynchronous SError inside the i.MX interconnect code and panics the kernel,
# on 7.1.0 and on 7.2.4 alike, every time the LCDIF driver binds. The board
# then hangs until the watchdog resets it. As a module that is recoverable -
# blacklist it and the system boots - and built in it is not, because the panic
# lands before any rootfs and the one escape left is an initcall_blacklist=
# argument on a command line that an inherited environment will not let you
# change. Modules until the SError is understood.
#
# If it is built in again, these are the symbols; CONFIG_DRM has to go =y for
# any of its drivers to, which pulls the KMS, display and DMA helpers and
# drm_client_lib in with it, and CONFIG_BACKLIGHT_CLASS_DEVICE only has to
# follow because the panel driver depends on it and a =y driver cannot depend
# on a module:
#
#   CONFIG_DRM=y
#   CONFIG_DRM_IMX_LCDIF=y
#   CONFIG_DRM_SAMSUNG_DSIM=y
#   CONFIG_BACKLIGHT_CLASS_DEVICE=y
#   CONFIG_DRM_PANEL_CHIPWEALTH_CH13726A=m

# The panel driver, which Mecha's own defconfig no longer enables.
#
# 7.2 renamed both the file and its Kconfig symbol:
#
#   7.1  panel-ddic-ch13726a.c        CONFIG_DRM_PANEL_DDIC_CH13726A
#   7.2  panel-chipwealth-ch13726a.c  CONFIG_DRM_PANEL_CHIPWEALTH_CH13726A
#
# arch/arm64/configs/mecha_v8_defconfig on 7.2 was not updated with it - it
# still carries CONFIG_DRM_PANEL_DDIC_CH13726A=m, a symbol that branch no longer
# defines. Kconfig silently drops an unknown symbol, so the panel driver is not
# built at all and the result is a system that boots to userspace with a dark
# panel: the same symptom as the 7.1 reset-polarity bug, from a different cause.
#
# Mecha do not hit this because their RPM build configures from redhat/ rather
# than from mecha_v8_defconfig. Drop this line once their defconfig catches up.
CONFIG_DRM_PANEL_CHIPWEALTH_CH13726A=m
