# Mecha Comet (i.MX8M Plus).
#
# The panel is a ch13726a,rp5: 1080x1240 over 4-lane MIPI DSI at 60 Hz,
# 65 x 75 mm - see rp5_display_mode in drivers/gpu/drm/panel/panel-ddic-ch13726a.c
# in Mecha's kernel. That is 1080/65 = 422 px/inch across and 1240/75 = 420 down,
# so 421 is the real number, not a rounded guess.
#
# This makes the Comet by far the densest screen LuneOS runs on: the PinePhone
# and PinePhone Pro are 282 and the PineTab2 is 132. GridUnit scales with DPI
# (19 at 282, 10 at 132), so 28 keeps the same physical size for a grid unit.
# Expect to want to adjust it after looking at the device - it is the one value
# here that is a judgement call rather than arithmetic.
#
# The panel is close to square (1080x1240), which no other LuneOS device is.
# TabletUi is off because the screen is 3.9" and phone-shaped layouts fit better
# than tablet ones at that size, not because of the aspect ratio.
#
# The device tree leaves "rotation" commented out in the panel node, so nothing
# declares a rotated mount. If the shell comes up sideways on real hardware, the
# fix is deviceinfo_compositor_geometry in a luneos-device-config adaptation -
# that one declaration also rotates evdevtouch, via 20-surface-manager-env.

[General]
ShowReticle=true
DisplayWidth=1080
DisplayHeight=1240
ShowNotificationsAtTop=false

[UI]
TabletUi=false
DPI=421
GridUnit=28

[Display]
# ti,opt3001 ambient light sensor on I2C - see the [als] block in
# sensord-comet-imx8mp.conf.
EnableALS=true
# Multiplier applied to the ALS reading before it is bucketed into a region.
# A sensor behind cover glass reads far below the real ambient level; 1.0 takes
# it at its word. Set per device through deviceinfo_als_calibration.
AlsCalibration=1.0

[Hardware]
Type=device
HasVolumeButton=true
# No power gpio-key in the device tree: the power button goes to the PCA9450
# PMIC, which handles it in hardware.
HasPowerButton=true
HasHomeButton=true
HasBrightnessControl=true
